services:
  triton:
    image: nvcr.io/nvidia/tritonserver:24.12-py3
    container_name: ocr_triton
    command: ["tritonserver", "--model-repository=/models"]
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    volumes:
      - ./triton_model_repository:/models:ro
    gpus:
      - driver: nvidia
        count: all
        capabilities:
          - gpu

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ocr_backend
    environment:
      TRITON_URL: triton:8000
      TRITON_MODEL_NAME: ${TRITON_MODEL_NAME:-svtr_ocr_onnx}
      TRITON_MODEL_VERSION: "1"
      TRITON_BATCH_SIZE: "2"
      OCR_MAX_WIDTH: "512"
      OCR_OVERLAP: "64"
      CORS_ORIGINS: http://localhost:8501,http://127.0.0.1:8501
    ports:
      - "8080:8080"
    depends_on:
      - triton

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ocr_frontend
    environment:
      API_BASE_URL: http://backend:8080
    ports:
      - "8501:8501"
    depends_on:
      - backend
